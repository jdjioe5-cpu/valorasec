groups:
  - name: valorasec_alerts
    rules:
      - alert: HighErrorRate
        expr: (sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'High HTTP error rate (> 5%)'
          description: 'API 5xx error rate has exceeded 5% over the last 5 minutes.'

      - alert: DatabaseDown
        expr: db_connection_pool_active == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Database connection pool failure'
          description: 'No active database connections reported in the connection pool.'

      - alert: RedisDown
        expr: redis_connected == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Redis cache disconnected'
          description: 'Redis instance ping failed or connectivity interrupted.'

      - alert: ScanQueueBacklog
        expr: scan_queue_depth > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Security scan queue backlog high'
          description: 'Pending security scan tasks have accumulated above 100 items.'
